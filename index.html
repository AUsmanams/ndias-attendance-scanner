<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDIAS 2026 Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #0b5d1e;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #0b5d1e;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    .instructions {
      color: #555;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>NDIAS 2026</h1>

  <div class="subtitle">
    Attendance Verification Scanner
  </div>

  <select id="cameraSelect">
    <option>Loading cameras...</option>
  </select>

  <div id="reader"></div>

  <div id="status">
    Starting camera...
  </div>

  <div class="instructions">
    Point the camera at the participant's NDIAS QR code.
  </div>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyhI6L_2ty0vNlPPyjPe05OIAdxjZlf4lskTTKnWqcKxRMvOMEN-wDBE9S_5HfMpnFE/exec";

let scanner = null;
let cameras = [];
let scanning = false;


/* GET AVAILABLE CAMERAS */

async function loadCameras() {

  const status = document.getElementById("status");
  const select = document.getElementById("cameraSelect");

  try {

    cameras = await Html5Qrcode.getCameras();

    select.innerHTML = "";

    if (!cameras || cameras.length === 0) {

      select.innerHTML =
        "<option>No camera found</option>";

      status.textContent =
        "No camera was found on this device.";

      return;
    }

    cameras.forEach((camera, index) => {

      const option = document.createElement("option");

      option.value = camera.id;

      option.textContent =
        camera.label || "Camera " + (index + 1);

      select.appendChild(option);

    });

    status.textContent =
      "Camera ready. Point it at the QR code.";

    startScanner(cameras[0].id);

  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera permission was not granted.";

  }

}


/* START SCANNER */

function startScanner(cameraId) {

  if (scanning) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(

    cameraId,

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      scanning = false;

      document.getElementById("status").textContent =
        "QR code detected. Opening participant record...";

      scanner.stop().then(function() {

        scanner.clear();

        /*
          SEND PARTICIPANT ID TO OUR
          EXISTING GOOGLE APPS SCRIPT
        */

        const participantID =
          encodeURIComponent(decodedText.trim());

        window.location.href =
          APPS_SCRIPT_URL + "?id=" + participantID;

      }).catch(function() {

        const participantID =
          encodeURIComponent(decodedText.trim());

        window.location.href =
          APPS_SCRIPT_URL + "?id=" + participantID;

      });

    },

    function(errorMessage) {

      // Normal QR scanning errors are ignored.

    }

  ).then(function() {

    scanning = true;

  }).catch(function(error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Unable to start this camera.";

  });

}


/* SWITCH CAMERA */

document.getElementById("cameraSelect")
  .addEventListener("change", function() {

    const selectedCamera = this.value;

    if (!scanner) {
      startScanner(selectedCamera);
      return;
    }

    scanning = false;

    scanner.stop().then(function() {

      scanner.clear();

      startScanner(selectedCamera);

    }).catch(function() {

      startScanner(selectedCamera);

    });

  });


/* START */

loadCameras();

</script>

</body>
</html>
