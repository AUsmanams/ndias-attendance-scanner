<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDIAS 2026 Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #0b5d1e;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #0b5d1e;
      color: white;
      border: none;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eef7ef;
      display: none;
      word-break: break-word;
    }

    .success {
      color: #0b5d1e;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>NDIAS 2026</h1>
  <div class="subtitle">QR Attendance Scanner</div>

  <select id="cameraSelect">
    <option>Loading cameras...</option>
  </select>

  <div id="reader"></div>

  <div id="result">
    <div class="success">QR CODE DETECTED</div>
    <p id="participantID"></p>
  </div>

</div>

<script>

let scanner;
let cameras = [];

async function loadCameras() {

  try {

    cameras = await Html5Qrcode.getCameras();

    const select = document.getElementById("cameraSelect");

    select.innerHTML = "";

    if (cameras.length === 0) {
      select.innerHTML = "<option>No camera found</option>";
      return;
    }

    cameras.forEach((camera, index) => {

      const option = document.createElement("option");

      option.value = camera.id;

      option.textContent =
        camera.label || "Camera " + (index + 1);

      select.appendChild(option);

    });

    startScanner(cameras[0].id);

    select.addEventListener("change", function() {

      restartScanner(this.value);

    });

  } catch (error) {

    document.getElementById("cameraSelect").innerHTML =
      "<option>Camera access failed</option>";

    console.error(error);

  }

}


function startScanner(cameraId) {

  scanner = new Html5Qrcode("reader");

  scanner.start(
    cameraId,
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      document.getElementById("participantID").textContent =
        "Participant ID: " + decodedText;

      document.getElementById("result").style.display = "block";

      scanner.stop();

    },

    function(errorMessage) {

      // Ignore normal scanning errors

    }

  ).catch(function(error) {

    console.error(error);

  });

}


function restartScanner(cameraId) {

  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        startScanner(cameraId);

      })
      .catch(function() {

        startScanner(cameraId);

      });

  } else {

    startScanner(cameraId);

  }

}


loadCameras();

</script>

</body>
</html>
