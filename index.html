<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDIAS 2026 Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
    }

    h1 {
      color: #0b5d1e;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
    }

    .section {
      margin-top: 20px;
      padding: 20px;
      background: #f8faf8;
      border-radius: 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #0b5d1e;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #0b5d1e;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .manual-button {
      background: #333;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }

    .or {
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
      color: #888;
    }

    .instructions {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>NDIAS 2026</h1>
    <div class="subtitle">
      Attendance Verification Scanner
    </div>
  </div>


  <!-- QR SCANNER -->

  <div class="section">

    <div class="section-title">
      📷 Scan Participant QR Code
    </div>

    <select id="cameraSelect">
      <option>Loading cameras...</option>
    </select>

    <div id="reader"></div>

    <div id="status">
      Starting camera...
    </div>

    <div class="instructions">
      Point the camera at the participant's QR code.
    </div>

  </div>


  <div class="or">
    — OR —
  </div>


  <!-- MANUAL PARTICIPANT ID -->

  <div class="section">

    <div class="section-title">
      ⌨️ Enter Participant ID
    </div>

    <input
      type="text"
      id="participantID"
      placeholder="Example: NDIAS/1.0/26/005"
      autocomplete="off"
    >

    <button
      class="manual-button"
      onclick="verifyParticipant()"
    >
      VERIFY PARTICIPANT
    </button>

  </div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyhI6L_2ty0vNlPPyjPe05OIAdxjZlf4lskTTKnWqcKxRMvOMEN-wDBE9S_5HfMpnFE/exec";

let scanner = null;
let cameras = [];
let scanning = false;


/*
 * LOAD AVAILABLE CAMERAS
 */

async function loadCameras() {

  const select =
    document.getElementById("cameraSelect");

  const status =
    document.getElementById("status");

  try {

    cameras =
      await Html5Qrcode.getCameras();

    select.innerHTML = "";

    if (!cameras || cameras.length === 0) {

      select.innerHTML =
        "<option>No camera found</option>";

      status.textContent =
        "No camera was found.";

      return;
    }


    cameras.forEach(function(camera, index) {

      const option =
        document.createElement("option");

      option.value =
        camera.id;

      option.textContent =
        camera.label ||
        "Camera " + (index + 1);

      select.appendChild(option);

    });


    /*
     * TRY TO SELECT THE BACK CAMERA
     * WHEN AVAILABLE
     */

    let preferredCamera = cameras[0];

    for (let i = 0; i < cameras.length; i++) {

      const label =
        (cameras[i].label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        preferredCamera = cameras[i];

        break;
      }
    }


    select.value =
      preferredCamera.id;

    startScanner(
      preferredCamera.id
    );

  } catch (error) {

    console.error(error);

    select.innerHTML =
      "<option>Camera access failed</option>";

    status.textContent =
      "Camera permission was not granted.";

  }
}


/*
 * START QR SCANNER
 */

function startScanner(cameraId) {

  if (scanning) {
    return;
  }

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    cameraId,

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      scanning = false;

      document.getElementById("status")
        .textContent =
        "QR detected. Opening participant record...";


      const participantID =
        encodeURIComponent(
          decodedText.trim()
        );


      scanner.stop()
        .then(function() {

          scanner.clear();

          openVerification(
            participantID
          );

        })
        .catch(function() {

          openVerification(
            participantID
          );

        });

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  )
  .then(function() {

    scanning = true;

    document.getElementById("status")
      .textContent =
      "Camera ready. Scan the QR code.";

  })
  .catch(function(error) {

    console.error(error);

    document.getElementById("status")
      .textContent =
      "Unable to start this camera.";

  });
}


/*
 * SWITCH CAMERA
 */

document.getElementById("cameraSelect")
  .addEventListener(
    "change",
    function() {

      const selectedCamera =
        this.value;

      if (!selectedCamera) {
        return;
      }

      scanning = false;


      if (!scanner) {

        startScanner(
          selectedCamera
        );

        return;
      }


      scanner.stop()
        .then(function() {

          scanner.clear();

          startScanner(
            selectedCamera
          );

        })
        .catch(function() {

          startScanner(
            selectedCamera
          );

        });

    }
  );


/*
 * MANUAL ID VERIFICATION
 */

function verifyParticipant() {

  const input =
    document.getElementById(
      "participantID"
    );

  const value =
    input.value.trim();


  if (!value) {

    alert(
      "Please enter a Participant ID."
    );

    input.focus();

    return;
  }


  const participantID =
    encodeURIComponent(value);


  openVerification(
    participantID
  );
}


/*
 * OPEN GOOGLE VERIFICATION PAGE
 */

function openVerification(
  participantID
) {

  window.location.href =
    APPS_SCRIPT_URL +
    "?id=" +
    participantID;
}


/*
 * ALLOW ENTER KEY
 */

document.getElementById(
  "participantID"
).addEventListener(
  "keypress",
  function(event) {

    if (event.key === "Enter") {

      verifyParticipant();

    }

  }
);


/*
 * START CAMERA
 */

loadCameras();

</script>

</body>
</html>
